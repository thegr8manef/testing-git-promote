name: Promote to GitLab

on:
  push:
    branches: [master]

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "thegr8manef"
          git config user.email "jedidimanef@gmail.com"

      - name: Push to GitLab
        run: |
          # Remove old remote if exists
          git remote remove gitlab || true

          # Add GitLab remote
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@gitlab.com/jedidimanef-group/testing-gitlab-pormote.git

          # Fetch GitLab main
          git fetch gitlab main

          # Merge GitLab main into local with auto-resolution (ours strategy)
          git merge gitlab/main --allow-unrelated-histories -s recursive -X ours -m "ci: sync github -> gitlab"

          # Force push master -> main on GitLab
          git push -f gitlab master:main
