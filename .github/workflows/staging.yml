name: staging — build & distribute

on:
  push:
    branches: [master]

# ─────────────────────────────────────────────────────────────
# INTERNAL TEST (current file)
#   Android → Firebase App Distribution  (free, instant)
#   iOS     → TestFlight                 (requires Apple dev account)
#
#
# PRODUCTION PUBLISH (see comments marked [PROD])
#   Android → Google Play (internal track → promote to production)
#   iOS     → App Store Connect (TestFlight → submit for review)
# ─────────────────────────────────────────────────────────────

jobs:
  # ─── Android staging ─────────────────────────────────────
  android:
    name: Android staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Fix gradlew permission
        working-directory: android
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Clean gradle
        working-directory: android
        run: ./gradlew clean

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # FIX: upgraded from deprecated v2 → v4
      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nessnaUp.apk
          path: android/app/build/outputs/apk/release/app-release.apk # ← FIXED

      # ── INTERNAL TEST: distribute via Firebase App Distribution ──
      # Requires secret: FIREBASE_APP_ID, FIREBASE_TOKEN (or service account JSON)
      # Add testers either by email list or a Firebase tester group name.
      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: internal-testers-attijari # tester group name in Firebase console
          file: android/app/build/outputs/apk/release/app-release.apk # ← also fix here
          releaseNotes: "Build from commit ${{ github.sha }}"

      # ── [PROD] Publish to Google Play ──────────────────────────
      # Uncomment this block when ready to publish to the Play Store.
      # Replace assembleRelease with bundleRelease and point path to the .aab.
      # Requires secret: PLAY_STORE_JSON_KEY (service account JSON key)
      #
      # - name: Build Release AAB
      #   working-directory: android
      #   run: ./gradlew bundleRelease
      #
      # - name: Publish to Google Play (internal track)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
      #     packageName: com.yourapp.package          # ← replace with your package name
      #     releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
      #     track: internal                           # internal → alpha → beta → production
      #     status: completed

