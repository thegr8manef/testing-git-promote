name: staging — build & distribute

on:
  push:
    branches: [master]

jobs:
  # ─── Android staging ───────────────────────────────
  android:
    name: Android staging
    runs-on: ubuntu-latest

    steps: # ✅ FIXED INDENTATION
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Fix gradlew permission
        working-directory: android
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Clean gradle APK
        working-directory: android
        run: ./gradlew clean

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

  # ─── iOS staging ───────────────────────────────────
  ios:
    name: iOS staging
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci # ✅ FIXED (was wrong before)


      # - name: Install CocoaPods
