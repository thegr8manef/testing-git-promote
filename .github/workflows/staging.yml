  # ─── Promote to GitLab — only if both pass ──────────────────
  promote:
    name: Promote to GitLab (prod)
    runs-on: ubuntu-latest
    # needs: [android, ios]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.email "jedidimanef@gmail.com"
          git config user.name "thegr8manef"

      - name: Push source code to GitLab (preserve app.json)
        run: |
          git remote add gitlab http://oauth2:${{ secrets.GITLAB_ACCESS_TOKEN }}@gitlab.com/jedidimanef-group/testing-gitlab-pormote.git

          # Fetch GitLab main so we can merge (keeps GitLab's app.json)
          git fetch gitlab main

          # Merge GitLab into local, keeping GitLab's versions of protected files
          git merge gitlab/main --allow-unrelated-histories --strategy-option=ours -m "ci: sync from staging" || true

          # Force push merged result to GitLab
          git push gitlab main --force
